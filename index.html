<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e2dc;--acc:#2f5d8a;--ok:#2e7d32;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e3;--mute:#9aa0a6;--line:#33373c;--acc:#7fb0e0;--ok:#7cc47f;--warn:#f0b35a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.meta{color:var(--mute);font-size:13px;margin-bottom:8px}.note{font-size:12.5px;color:var(--mute)}
.srch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.srch .full{grid-column:1/-1}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.btn{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.btn2{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.hit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;margin:6px 0;font:inherit;cursor:pointer}.hit small{color:var(--mute)}
.ex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.ex img{max-width:260px;width:100%;border-radius:6px;border:1px solid var(--line)}
.ctl{display:grid;grid-template-columns:2fr 1fr;gap:8px}.ctl1{margin-top:8px}.ctl1 select{width:100%}
.mac{position:relative;margin:8px 0}.mac pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.mac .cp{position:absolute;top:6px;right:6px;font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.mac .lbl{font-size:12px;color:var(--mute);margin-bottom:3px}
details{margin-top:10px}summary{cursor:pointer;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600}
.eq{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--mute);margin-left:4px}
.pad{background:#fff3cd;color:#5c4400;border:2px solid #f0a500;border-radius:10px;padding:12px 14px;margin:10px 0}
@media (prefers-color-scheme:dark){.pad{background:#3a2e10;color:#ffd77a;border-color:#c98a00}}
.padt{font-weight:700;font-size:16px;margin-bottom:4px}.big{font-size:20px}
.padc{display:inline-block;background:#fff3cd;color:#5c4400;border:1px solid #f0a500;border-radius:6px;padding:2px 6px;font-weight:700}
@media (prefers-color-scheme:dark){.padc{background:#3a2e10;color:#ffd77a;border-color:#c98a00}}
.sm{padding:4px 8px;font-size:12px;white-space:nowrap}.lvl summary{font-size:12px}.lvl div{font-size:12px}

<div class="sub">作業精度／加工精度／製作力 5734／5517／649（A 方案）・預設不用「掌握」（可切換）・非專家（不含專心致志、快速改革）・不含藥・巨集用繁中服技能名・不分職業：難度、品質上限、耐久相同就用同一組巨集</div>
<div class="card"><h3><span>檢索</span></h3>
<div class="meta">輸入製作畫面的「難度」和右下角的品質上限；耐久可不填。也可以打中文品名。</div>

<script>
let DATA={};
const FOODS=["不吃","高山茶","犎牛牛排","酸檸檬醃魚","椒麻鰻魚"];
const $=s=>document.querySelector(s);
let keys=[];function initKeys(){keys=Object.keys(DATA).sort((a,b)=>{const x=DATA[a],y=DATA[b];return x.rl-y.rl||x.prog-y.prog||x.q-y.q})}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function uniq(a){return [...new Set(a)]}
function lab(k){const d=DATA[k];const n=uniq(d.rec.map(r=>r.n));return `難度 ${d.prog}／品質 ${d.q}／耐久 ${d.dur}・${n.slice(0,2).join("、")}${n.length>2?" 等":""}`}
function fillGrp(){keys.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=lab(k);$("#grp").appendChild(o)})}
FOODS.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n+(n==="不吃"?"":" HQ");$("#food").appendChild(o)});
function macroBlock(ms){return ms.map((m,i)=>`<div class="mac"><div class="lbl">巨集 ${i+1}／${ms.length}</div><pre>${esc(m)}</pre><button class="cp">複製</button></div>`).join("")}
function card(title,tag,v,extra){const pct=v.mq?Math.round(v.iq/v.mq*1000)/10:0,done=v.fq>=v.mq;
 return `<div class="card"><h3><span>${title}</span><span class="tag">${tag}</span></h3><div class="meta">${v.s} 步・品質 <b class="${done?'ok':'warn'}">${v.fq.toLocaleString()}／${v.mq.toLocaleString()}</b>${v.iq?`・初始品質 ${v.iq.toLocaleString()}（${pct}%）`:""}${extra||""}</div>${macroBlock(v.m)}</div>`}
function chainOf(r,mq){const W=r.hq.reduce((s,i)=>s+i.a*i.il,0);const u=[];r.hq.slice().sort((a,b)=>b.il-a.il).forEach(i=>{for(let k=0;k<i.a;k++)u.push(i)});let s=0;const out=[],cnt={};for(const x of u){s+=x.il;cnt[x.n]=(cnt[x.n]||0)+1;out.push({q:Math.floor(mq*r.m/100*s/W),items:Object.entries(cnt).map(([n,a])=>n+"×"+a).join("、"),n:out.length+1})}return out}
function recMin(r,x,mq){if(!r.m||!r.hq.length)return{none:"這個配方不能墊 HQ"};const c=chainOf(r,mq);const hit=c.find(l=>l.q>=x.pmin);return{c,hit}}
let SEL=null;
function render(){const k=$("#grp").value,f=$("#food").value,d=DATA[k],x=d.foods[f];let h=`<div class="note" style="margin:6px 2px">這組：難度 ${d.prog}・品質上限 ${d.q}・耐久 ${d.dur}・配方等級 ${d.rl}・${d.rec.length} 個配方</div>`;
 if(!x){$("#out").innerHTML=h+'<div class="card warn">這組還在計算中，稍後重新整理再看。</div>';return}
 if(x.nosol){$("#out").innerHTML=h+`<div class="card warn">${f==="不吃"?"不吃料理時":"吃這個料理時"}，A 方案在耐久用完前推不滿進展（無解）。請換料理${MODE==="nm"?"，或學會「掌握」後切到「已學掌握」":""}。</div>`;return}
 const n=x.none,mq=n.mq,needPad=n.fq<n.mq&&d.mqf>0;
 if(n.fq>=n.mq)h+=card("不墊就能滿品質","不墊",n);
 else if(!d.mqf)h+=`<div class="card"><h3><span>做不到滿品質</span><span class="tag">不能墊</span></h3><div class="meta">這組素材不能墊 HQ，最高 ${n.fq.toLocaleString()}／${mq.toLocaleString()}（${n.s} 步）。</div>${macroBlock(n.m)}</div>`;
 else if(x.pending)h+=`<div class="card warn">這組的實際墊法級距還在計算中。</div>`;
 else if(x.pmin==null)h+=`<div class="pad"><b>墊滿也做不到滿品質</b>，請改吃料理。</div>`;
 else{h+=`<div class="pad"><div class="padt">要墊 HQ 才能滿品質</div>起始品質至少 <b class="big">${x.pmin.toLocaleString()}</b>（實際級距；${x.fmax!=null?"再低一級 "+x.fmax.toLocaleString()+" 就做不到":"不墊就做不到"}）<br>下面每個配方都寫了<b>要放幾個、哪些 HQ</b>，點「看巨集」拿那個配方的巨集。<br><b>※ 半成品名稱只是舉例</b>（先放品級高的）：可以自行挑選要墊哪些 HQ 半成品，只要畫面上的起始品質到達上面的數字就能用同一組巨集。</div>`;
  if(x.full)h+=`<details><summary>滿墊（可墊的全放，${x.full.s} 步）巨集</summary>${card("滿墊","滿墊",x.full)}</details>`;
  h+=`<details><summary>不墊的巨集（做不到滿品質，最高 ${n.fq.toLocaleString()}）</summary>${macroBlock(n.m)}</details>`}
 h+=`<div id="sel"></div>`;
 h+=`<details open><summary>這組的配方（${d.rec.length}）</summary><table><tr><th>職業</th><th>配方</th>${needPad&&!x.pending&&x.pmin!=null?"<th>要墊（舉例，可自行挑選）</th><th></th>":""}</tr>${d.rec.map((r,i)=>{let cell="";if(needPad&&!x.pending&&x.pmin!=null){const m=recMin(r,x,mq);if(m.none)cell=`<td class="note">${m.none}</td><td></td>`;else if(!m.hit)cell=`<td class="warn">墊滿也不夠</td><td></td>`;else{const lv=x.lv[String(m.hit.q)];cell=`<td><span class="padc">${esc(m.hit.items)}</span><br><span class="note">共 ${m.hit.n} 個 → 起始品質 ${m.hit.q.toLocaleString()}</span><details class="lvl"><summary>級距</summary>${m.c.map(l=>`<div class="${l.q>=x.pmin?'ok':'note'}">墊 ${l.n} 個（${esc(l.items)}）→ ${l.q.toLocaleString()}${l.q>=x.pmin?" ✔":" 不夠"}</div>`).join("")}</details></td><td>${lv?`<button class="btn2 sm" data-q="${m.hit.q}" data-r="${i}">看巨集<br>${lv.s} 步</button>`:""}</td>`}}
  return `<tr><td>${r.j}</td><td>${esc(r.n)}${r.eq?'<span class="eq">裝備</span>':""}${r.tw?"":" <span class='note'>(簡中服名)</span>"}</td>${cell}</tr>`}).join("")}</table></details>`;
 $("#out").innerHTML=h;
 document.querySelectorAll("button[data-q]").forEach(b=>b.onclick=()=>{const v=x.lv[b.dataset.q],r=d.rec[+b.dataset.r];const m=recMin(r,x,mq);$("#sel").innerHTML=card(`${esc(r.n)}：墊 ${esc(m.hit.items)}`,"最少墊",v,"・用這組巨集");bindCopy();$("#sel").scrollIntoView({behavior:"smooth",block:"start"})});
 bindCopy()}
function bindCopy(){document.querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{const t=b.previousElementSibling.textContent;try{await navigator.clipboard.writeText(t);b.textContent="已複製"}catch(e){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="已選取，請按複製"}setTimeout(()=>b.textContent="複製",1500)})}
function goto(k){$("#grp").value=k;render();$("#grp").scrollIntoView({behavior:"smooth",block:"start"})}
function search(){const n=$("#qn").value.trim(),dd=parseInt($("#qd").value),qq=parseInt($("#qq").value),uu=parseInt($("#qu").value);const H=$("#hits");
 if(isNaN(dd)&&isNaN(qq)&&isNaN(uu)&&!n){H.innerHTML="";return}
 const out=[];for(const k of keys){const d=DATA[k];if(!isNaN(dd)&&d.prog!==dd)continue;if(!isNaN(qq)&&d.q!==qq)continue;if(!isNaN(uu)&&d.dur!==uu)continue;let names=uniq(d.rec.map(r=>r.n));if(n){names=uniq(d.rec.filter(r=>r.n.includes(n)||(r.al||'').includes(n)).map(r=>r.n));if(!names.length)continue}out.push({k,d,names})}
